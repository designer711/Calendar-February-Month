<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="theme-color" content="#635BFF">

<title>My Money, My Choice</title>

<style>
*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

:root{
    --primary:#635BFF;
    --primary2:#8B83FF;
    --dark:#25233A;
    --muted:#77758A;
    --bg:#F5F6FB;
    --white:#fff;

    --save:#12A878;
    --save-bg:#E8F8F2;

    --spend:#F39C12;
    --spend-bg:#FFF5DF;

    --give:#E74C3C;
    --give-bg:#FFEBE8;
}

body{
    margin:0;
    min-height:100vh;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
    background:
        radial-gradient(circle at 0% 0%,#E9E7FF 0,transparent 30%),
        radial-gradient(circle at 100% 100%,#E3FFF4 0,transparent 30%),
        var(--bg);
    color:var(--dark);
}

button,input{
    font:inherit;
}

button{
    border:0;
    cursor:pointer;
}


/* CALENDAR HEADER */
.calendar-header{
    width:100%;
    margin:0;
    padding:0;
    overflow:hidden;
    background:#0b3f80;
}

.calendar-header img{
    display:block;
    width:100%;
    height:auto;
    max-width:none;
}

.app{
    width:100%;
    max-width:900px;
    margin:auto;
    padding:15px;
}

.screen{
    display:none;
    animation:show .35s ease;
}

.screen.active{
    display:block;
}

@keyframes show{
    from{
        opacity:0;
        transform:translateY(12px);
    }
    to{
        opacity:1;
        transform:translateY(0);
    }
}

/* TOP */

.topbar{
    height:58px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:10px;
}

.brand{
    display:flex;
    align-items:center;
    gap:10px;
    font-size:17px;
    font-weight:900;
}

.brand-icon{
    width:40px;
    height:40px;
    display:grid;
    place-items:center;
    border-radius:13px;
    color:white;
    background:linear-gradient(135deg,var(--primary),var(--primary2));
    box-shadow:0 8px 20px rgba(99,91,255,.25);
}

.back{
    display:none;
    background:white;
    border:1px solid #E5E5EE;
    padding:9px 14px;
    border-radius:12px;
    font-weight:800;
}

/* HERO */

.hero{
    background:linear-gradient(135deg,var(--primary),var(--primary2));
    color:white;
    border-radius:28px;
    padding:34px 22px;
    text-align:center;
    box-shadow:0 18px 45px rgba(76,67,200,.22);
    margin-bottom:18px;
}

.hero-icon{
    font-size:48px;
}

.hero h1{
    margin:8px 0;
    font-size:clamp(28px,7vw,44px);
    line-height:1.05;
}

.hero p{
    max-width:620px;
    margin:auto;
